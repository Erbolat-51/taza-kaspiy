services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taza
      POSTGRES_PASSWORD: taza
      POSTGRES_DB: taza
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taza -d taza']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
